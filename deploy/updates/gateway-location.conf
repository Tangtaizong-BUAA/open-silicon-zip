    # BEGIN open-silicon-zip updates
    location ^~ /open-silicon-zip/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $osz_updates open-silicon-zip-updates:8080;
        rewrite ^/open-silicon-zip/(.*)$ /$1 break;
        proxy_pass http://$osz_updates;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        limit_except GET { deny all; }
    }
    # END open-silicon-zip updates
