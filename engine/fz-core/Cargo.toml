[package]
name = "fz-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Apple silicon oriented archive engine for Open Silicon Zip"

[features]
# Legacy read-side formats (CAB, LHA, ISO, cpio, ar/deb, rpm, xar, lzip, .Z, ...) through the system libarchive
# (pkg-config style dynamic linking: `libarchive-dev` on Linux, the SDK copy on macOS). Disable with --no-default-features.
default = ["legacy"]
legacy = []

[dependencies]
aes = "0.9.3"
brotli = "9.0.0"
bzip2 = "0.6.1"
cipher = "0.5.2"
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.2"
crossbeam-channel = "0.5.17"
crossbeam-utils = "0.8.23"
ctr = "0.10.1"
deflate64 = "0.1.12"
encoding_rs = "0.8.42"
filetime = "0.2.29"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
hmac = "0.13.0"
libdeflater = "1.26.1"
lz4_flex = "0.14.0"
md-5 = "0.11.0"
pbkdf2 = "0.13.0"
ppmd-rust = "1.5.0"
rand = "0.10.3"
rayon = "1.12.0"
serde_json = "1.0.151"
sevenz-rust2 = { version = "0.23.0", features = ["zstd", "deflate", "lz4", "brotli", "liblzma"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
tar = "0.4.46"
thiserror = "2.0.21"
unicode-normalization = "0.1.25"
unrar = "0.5.8"
walkdir = "2.5.0"
xz2 = "0.1.7"
zstd = { version = "0.14.1", features = ["zstdmt"] }

tempfile = "3.27.0"
signal-hook = { version = "0.4.5", default-features = false }

[dev-dependencies]

[patch.crates-io]
sevenz-rust2 = { path = "../vendor/sevenz-rust2" }

[profile.release]
lto = "thin"
codegen-units = 1
